---
name: Release pipeline

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Release as a pre-release"
        type: boolean
        required: true

jobs:
  tag:
    uses: $/.github/workflows/release-tag.yml
    with:
      prerelease: ${{ inputs.prerelease }}
    secrets: inherit

  build:
    needs: tag
    uses: $/.github/workflows/release-build.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit

  release:
    needs: [tag, build]
    uses: $/.github/workflows/release-create.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      prerelease: ${{ inputs.prerelease }}
      changelog: ${{ needs.tag.outputs.changelog }}
    secrets: inherit
...
