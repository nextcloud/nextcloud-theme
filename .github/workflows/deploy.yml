name: Deployment artifact

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: "--no-dev"
          ignore-cache: "yes"

      - name: Read package.json node and npm engines version
        uses: nextcloud-libraries/parse-package-engines-action@39fcc545a815c353dd0a3fd8fd2ef6e59fd02b92 # v0.2.0
        id: versions
        # Continue if no package.json
        continue-on-error: true

      - name: Set up node ${{ steps.versions.outputs.node-version }}
        # Skip if no package.json
        if: ${{ steps.versions.outcome == 'success' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node-version }}
          package-manager-cache: false

      - name: Build
        # Skip if no package.json
        if: ${{ steps.versions.outcome == 'success' }}
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          npm ci
          npm run build --if-present

      - name: Update version
        run: |
          sed -i 's/Version: 1.0/Version: ${{ github.sha }}/g' style.css

      - name: Archive production artifacts
        uses: actions/upload-artifact@v7
        with:
          name: theme-package
          retention-days: 1
          path: |
            !acf.functions.stub.php
            blocks
            dist
            lib
            *.php
            !.php-cs-fixer.dist.php
            screenshot.png
            style.css
            vendor
